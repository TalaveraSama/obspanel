<!doctype html>
<html><head><meta charset="utf-8"><title>CHANNEL ID</title></head>
<body>
<h2>📺 CHANNEL ID</h2>
<label><input id="enabled" type="checkbox" checked> Insertar automáticamente</label>
<select id="mode"><option value="random">Aleatorio</option><option value="sequential">Secuencial</option></select>
<input id="file" type="file" accept="video/*">
<input id="name" placeholder="Nombre del ID">
<button onclick="uploadId()">Agregar video</button>
<div id="list"></div>
<script>
async function load(){
 const d=await (await fetch('/api/channel-id')).json();
 enabled.checked=!!d.config.enabled; mode.value=d.config.mode;
 list.innerHTML=d.items.map(x=>`<div>${x.name} — ${Number(x.duration||0).toFixed(1)}s
 <button onclick="toggleId(${x.id})">${x.enabled?'Desactivar':'Activar'}</button>
 <button onclick="delId(${x.id})">Eliminar</button></div>`).join('');
}
enabled.onchange=save; mode.onchange=save;
async function save(){await fetch('/api/channel-id/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:enabled.checked,mode:mode.value,between_movies:true})});load();}
async function uploadId(){let f=file.files[0];if(!f)return;let fd=new FormData();fd.append('file',f);fd.append('name',name.value);await fetch('/api/channel-id/upload',{method:'POST',body:fd});file.value='';name.value='';load();}
async function toggleId(id){await fetch('/api/channel-id/'+id+'/toggle',{method:'POST'});load();}
async function delId(id){await fetch('/api/channel-id/'+id,{method:'DELETE'});load();}
load();
</script></body></html>
